name: Builds

on:
  push:
    branches:
      - base
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Builds ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  Clang_Tidy:
    name: Clang Tidy
    uses: ./.github/workflows/runner_build.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
      runner: ubuntu-26.04
      compiler: clang
      compiler_version: 22
      build_type: Debug
      tracy: false
      build_modules: false
      save_cache: true
      upload_artifact: false
      clang_tidy: true

  Runner_Build:
    name: ${{ matrix.build_modules && 'Modules Build' || (matrix.save_cache && 'Cache Build' || 'Build') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            runner: ubuntu-26.04
            compiler: gcc
            compiler_version: 15
            tracy: false
            build_modules: false
            save_cache: true
            upload_artifact: false
            clang_tidy: false
          # Compiles the cpp modules. Debug reuses the ubuntu cache build's
          # warm cache and never enables IPO/LTO, so this is the cheapest slot.
          - build_type: Debug
            runner: ubuntu-26.04
            compiler: gcc
            compiler_version: 15
            tracy: false
            build_modules: true
            save_cache: false
            upload_artifact: false
            clang_tidy: false
    uses: ./.github/workflows/runner_build.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
      runner: ${{ matrix.runner }}
      compiler: ${{ matrix.compiler }}
      compiler_version: ${{ matrix.compiler_version }}
      build_type: ${{ matrix.build_type }}
      build_modules: ${{ matrix.build_modules }}
      tracy: ${{ matrix.tracy }}
      save_cache: ${{ matrix.save_cache }}
      upload_artifact: ${{ matrix.upload_artifact }}
      clang_tidy: ${{ matrix.clang_tidy }}

  Docker_Build:
    name: ${{ matrix.save_cache && 'Cache Build' || 'Build' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Release
            os: ubuntu
            compiler: gcc
            compiler_version: 15
            clang_format_version: 22
            tracy: false
            build_modules: false
            save_cache: false
            publish: true
          # - build_type: Debug
          #   os: ubuntu
          #   compiler: gcc
          #   compiler_version: 14
          #   tracy: false
          #   build_modules: false
          #   save_cache: true
          #   publish: false
          - build_type: Release
            os: alpine
            compiler: gcc
            compiler_version: 15
            clang_format_version: 22
            tracy: false
            build_modules: false
            save_cache: false
            publish: true
    uses: ./.github/workflows/docker_build.yml
    with:
      chalk_on: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
      racecar_run: ${{ inputs.racecar_run }}
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      compiler_version: ${{ matrix.compiler_version }}
      clang_format_version: ${{ matrix.clang_format_version }}
      build_type: ${{ matrix.build_type }}
      save_cache: ${{ matrix.save_cache }}
      build_modules: ${{ matrix.build_modules }}
      tracy: ${{ matrix.tracy }}
      upload_artifact: false
      publish: ${{ matrix.publish }}
